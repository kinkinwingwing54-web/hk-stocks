name: HK Stock Radar

on:
  schedule:
    # 港股收市後一小時自動執行 (香港時間星期一至五下午 5:00)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas matplotlib

      - name: Run script
        run: |
          python radar.py
